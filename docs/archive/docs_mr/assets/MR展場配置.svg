<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<rect width="1920" height="1200" fill="#f7f9fc"/>
<text x="65" y="60" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="38" fill="#24334b" text-anchor="start">音虫 MR｜展場與互動配置</text>
<text x="65" y="110" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="22" fill="#66758b" text-anchor="start">PC 執行 Unity，Quest 3 透視真實展場；只有回收站有實體外殼，虛擬模型與特效疊合其上。</text>
