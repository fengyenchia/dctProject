<text x="90" y="175" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="22" fill="#66758b" text-anchor="start">實際展場｜11.5 × 5 公尺估算，非按比例施工圖</text>
<text x="770" y="255" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="24" fill="#66758b" text-anchor="middle">一次一人｜在已設定活動區內實際走動與轉頭</text>
