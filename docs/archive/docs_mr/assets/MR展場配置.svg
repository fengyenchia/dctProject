<text x="1120" y="420" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#76569c" text-anchor="middle">初始隱藏／循聲尋找</text>
<rect x="347" y="570" width="226" height="90" rx="12" fill="#eee7fb" stroke="#9a7ac7" stroke-width="3" stroke-dasharray="10 7"/>
<text x="460" y="603" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="21" fill="#24334b" text-anchor="middle">B01 虛擬群落</text>
<text x="460" y="635" dominant-baseline="central" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#76569c" text-anchor="middle">初始隱藏／循聲尋找</text>
<circle cx="845" cy="505" r="27" fill="#c2e5ff" stroke="#4b84b1" stroke-width="3"/>
