<polygon points="250.0,550 430,615.0 250.0,680 70,615.0" fill="#fff0e0" stroke="#c99655" stroke-width="2"/>
<text x="250.0" y="623.0" text-anchor="middle" font-size="23" fill="#263d50">本場處於可回收階段？</text>
<rect x="750" y="560" width="360" height="104" rx="16" fill="#fff0e0" stroke="#c99655" stroke-width="2"/>
<text x="930.0" y="605.0" text-anchor="middle" font-size="23" fill="#263d50">不授權</text>
<text x="930.0" y="635.0" text-anchor="middle" font-size="23" fill="#263d50">維持提示</text>
