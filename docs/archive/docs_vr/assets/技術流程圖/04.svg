<text x="250.0" y="1385.0" text-anchor="middle" font-size="23" fill="#263d50">噪音能量轉化為物品</text>
<text x="250.0" y="1415.0" text-anchor="middle" font-size="23" fill="#263d50">VR 城市修復演出</text>
<rect x="70" y="1530" width="360" height="104" rx="16" fill="#f0eafa" stroke="#9a7ab9" stroke-width="2"/>
<text x="250.0" y="1575.0" text-anchor="middle" font-size="23" fill="#263d50">結尾／固定成果快照</text>
<text x="250.0" y="1605.0" text-anchor="middle" font-size="23" fill="#263d50">接圖 05 保存與交付</text>
<text x="48" y="1800" font-size="20" fill="#536a7e">到站資格保留到本場回收或結束；重新定位則清除，需再次到站。</text>
<text x="48" y="1829" font-size="20" fill="#536a7e">這是 Unity 虛擬範圍判定；沒有讀取實體 NFC。重複確認不重複結算。</text>
