<path d="M250.0,1444 L250.0,1530" fill="none" stroke="#64798b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="70" y="170" width="360" height="104" rx="16" fill="#e5f4f1" stroke="#4c9c8b" stroke-width="2"/>
<text x="250.0" y="215.0" text-anchor="middle" font-size="23" fill="#263d50">任務達成或 SAN 達限制</text>
<text x="250.0" y="245.0" text-anchor="middle" font-size="23" fill="#263d50">進入 Return／停止捕捉</text>
