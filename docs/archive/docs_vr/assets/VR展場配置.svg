<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64798b"/></marker></defs>
<rect width="1300" height="740" fill="#fafbfd"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" fill="#263d50">
<text x="45" y="65" font-size="32" font-weight="700">VR 展場功能配置</text>
<text x="45" y="105" font-size="21">功能關係示意，非按比例施工圖；VR 城市範圍不等於實際步行範圍。</text>
<rect x="45" y="180" width="260" height="350" rx="18" fill="#e5f4f1" stroke="#4c9c8b" stroke-width="2"/>
<text x="80" y="230" font-size="26" font-weight="700">接待／配戴</text>
<text x="80" y="290" font-size="23">前導與操作說明</text><text x="80" y="335" font-size="23">頭戴與控制器檢查</text><text x="80" y="380" font-size="23">工作人員協助配戴</text>
<rect x="385" y="180" width="490" height="350" rx="18" fill="#eaf0ff" stroke="#6887c6" stroke-width="2"/>
<text x="425" y="230" font-size="26" font-weight="700">單人 VR 體驗區</text>
<rect x="430" y="265" width="400" height="215" rx="15" fill="#fff" stroke="#6887c6" stroke-dasharray="10 7"/>
<text x="475" y="315" font-size="23">可確認邊界的活動範圍</text><text x="475" y="360" font-size="23">轉頭／手部操作／小幅移動</text><text x="475" y="405" font-size="23">控制器操作虛擬城市探索</text><text x="475" y="450" font-size="21">活動面積依選定設備與場勘配置</text>
<rect x="955" y="180" width="300" height="350" rx="18" fill="#f0eafa" stroke="#9a7ab9" stroke-width="2"/>
<text x="990" y="230" font-size="26" font-weight="700">離場／成果</text>
<text x="990" y="290" font-size="23">取下頭戴與清潔</text><text x="990" y="335" font-size="23">取得個人成果 QR</text><text x="990" y="380" font-size="23">手機開啟線上紀念品</text>
<path d="M305 350 L375 350" stroke="#64798b" stroke-width="3" marker-end="url(#a)"/>
<path d="M875 350 L945 350" stroke="#64798b" stroke-width="3" marker-end="url(#a)"/>
<rect x="385" y="595" width="870" height="95" rx="15" fill="#eef4fa" stroke="#7b95ae"/>
<text x="415" y="635" font-size="24">後台：PCVR 電腦／頭戴連線／Gateway／管理螢幕／充電</text>
<text x="415" y="670" font-size="21">可監看觀眾畫面，控制開始、暫停與重置；路線與配線另依場地配置。</text>
<path d="M630 595 L630 540" stroke="#64798b" stroke-width="2.5" marker-end="url(#a)"/>
</g></svg>